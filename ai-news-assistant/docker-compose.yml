services:
  ai-news-assistant:
    build: .
    image: ai-news-assistant:latest
    container_name: ai-news-assistant
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # 必填：LLM API Key（在 .env 中配置 DEEPSEEK_API_KEY）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
    volumes:
      # 数据持久化：报告 / 归档 / 记忆 / 缓存（首次自动创建）
      - ./data:/app/data
    restart: unless-stopped
